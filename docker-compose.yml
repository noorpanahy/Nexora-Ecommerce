services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: nexora-backend

    ports:
      - "8000:8000"

    environment:
      APP_ENV: local
      APP_DEBUG: "true"

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ecommerce_db
      DB_USERNAME: ecommerce
      DB_PASSWORD: ecommerce_password

    depends_on:
      mysql:
        condition: service_healthy

    volumes:
      - ./backend:/var/www/html

    networks:
      - nexora-network

  mysql:
    image: mysql:8.0

    container_name: nexora-mysql

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ecommerce_db
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: ecommerce_password
      MYSQL_ROOT_PASSWORD: root_password

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-proot_password",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - nexora-network

networks:
  nexora-network:

volumes:
  mysql_data:
